<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/devdeck-mark.svg" type="image/svg+xml" />
    <title>DevDeck</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f7f0e8 0%, #f2f5ef 100%);
        color: #142013;
        font-family: "Iowan Old Style", "Palatino Linotype", serif;
      }

      main {
        max-width: 36rem;
        padding: 2.5rem;
        border: 1px solid rgba(20, 32, 19, 0.12);
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 24px 60px rgba(20, 32, 19, 0.08);
        text-align: center;
      }

      img {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 2.25rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/devdeck-mark.svg" alt="DevDeck" width="64" height="64" />
      <h1>DevDeck</h1>
      <p>The dashboard UI export is not ready yet, but the local DevDeck session server is running.</p>
    </main>
  </body>
</html>
